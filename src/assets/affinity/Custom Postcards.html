}

/* Style the links inside the navigation bar */
.topnav a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;

  background-color: orchid;

.topnav .icon {
  display: none;
}

  display: "flex";
  overflow-x: "auto";
  padding: "10px 0";
  gap: "10px";

  width: 100px;
  height: "auto";
  cursor: "pointer";
  border: "2px solid transparent";
  margin-top: 0;
}

@media screen and (max-width: 600px) {
  .topnav a:not(:first-child) {
    display: none;
  }
  .topnav a.icon {
    float: right;
    display: block;
  }
}

@media screen and (max-width: 600px) {
  .topnav.responsive {
    position: relative;
  }
  .topnav.responsive a.icon {
    position: absolute;
    right: 0;
    top: 0;
